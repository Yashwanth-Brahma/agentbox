default: allow
rules:
  - name: no-deletes
    tool: "delete_*"
    decision: block

  - name: big-refunds
    tool: "refund"
    when:
      amount: { gt: 5000 }
    decision: ask

  - name: readonly-sql
    tool: "run_sql"
    when:
      query: { matches: "*DROP*" }
    decision: block

chains:
  - name: no-send-after-secrets
    after:
      tool: "read_file"
      when:
        path: { matches: "*.env*" }
    then:
      tool: "send_*"
      decision: block
